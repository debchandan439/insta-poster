name: Daily Instagram Post

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish next post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 post.py

      - name: Save queue state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "Mark post as published" && git push)
