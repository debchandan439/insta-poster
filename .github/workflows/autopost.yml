name: BhaktiBox AutoPost

on:
  push:
    branches: [main]
    paths: ["incoming/**"]
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC = 09:30 IST
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    # Comments count only if the repository owner wrote them on an "Approve:" issue
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.comment.author_association == 'OWNER' && startsWith(github.event.issue.title, 'Approve:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run AutoPost
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python -m autopost.main
